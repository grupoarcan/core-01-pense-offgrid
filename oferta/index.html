<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oferta Pense Offgrid</title>
  <meta name="description" content="Oferta selecionada pelo ecossistema Pense Offgrid." />
  <meta name="theme-color" content="#0b0f14" />
  <style>
    :root{--bg:#080c10;--card:#111821;--card2:#151f2b;--line:rgba(255,255,255,.10);--text:#f6f7f9;--muted:#a7b0bd;--orange:#ff8a1f;--orange2:#ffb15f;--green:#20d47b;--danger:#ff5555;--shadow:0 24px 80px rgba(0,0,0,.45)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#17212d 0,#080c10 42%,#05070a 100%);color:var(--text);min-height:100vh} a{color:inherit}.wrap{width:min(1120px,92vw);margin:0 auto;padding:28px 0 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none}.logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,var(--orange),#ffcf7a);display:grid;place-items:center;color:#111;font-weight:900;box-shadow:0 10px 30px rgba(255,138,31,.22)}.brand strong{display:block;font-size:1rem}.brand span{display:block;color:var(--muted);font-size:.85rem}.back{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:11px 14px;border-radius:14px;text-decoration:none;color:var(--muted)}.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:26px;align-items:stretch}.media{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);min-height:430px;display:grid;place-items:center;overflow:hidden;position:relative}.media img{width:100%;height:100%;object-fit:cover;display:block}.media .placeholder{font-size:5rem;opacity:.55}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,138,31,.35);background:rgba(255,138,31,.12);color:#ffd8ac;border-radius:999px;padding:8px 12px;font-weight:800;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}.panel{background:linear-gradient(180deg,rgba(21,31,43,.96),rgba(12,17,23,.98));border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:28px}.panel h1{font-size:clamp(2rem,5vw,4.1rem);line-height:.98;margin:16px 0 14px;letter-spacing:-.05em}.desc{color:#d3d8df;line-height:1.65;font-size:1.04rem}.priceRow{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:22px 0}.price{font-size:2.2rem;font-weight:1000;color:#fff}.old{color:var(--muted);text-decoration:line-through}.coupon{display:inline-flex;align-items:center;gap:8px;border:1px dashed rgba(255,255,255,.24);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.04);color:#fff}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.meta div{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(255,255,255,.035)}.meta small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;font-weight:800;margin-bottom:4px}.meta strong{font-size:.98rem}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:950;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:.2s transform,.2s opacity}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#111;box-shadow:0 16px 34px rgba(255,138,31,.22)}.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff}.btn.disabled{opacity:.55;pointer-events:none}.details{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:24px;padding:20px}.box h2{margin:0 0 10px;font-size:1.1rem}.box p{margin:0;color:var(--muted);line-height:1.6}.grid{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.offerCard{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:22px;overflow:hidden;text-decoration:none}.offerCard img{width:100%;height:140px;object-fit:cover;background:#111}.offerCard div{padding:14px}.offerCard strong{display:block;margin-bottom:6px}.offerCard span{color:var(--orange2);font-weight:900}.loading,.empty{min-height:55vh;display:grid;place-items:center;text-align:center;color:var(--muted)}.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.12);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:820px){.hero{grid-template-columns:1fr}.media{min-height:300px}.panel{padding:22px}.meta,.details{grid-template-columns:1fr}.actions .btn{width:100%}.topbar{align-items:flex-start}.back{font-size:.9rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <a class="brand" href="/">
        <div class="logo">⚡</div>
        <div><strong>Pense Offgrid</strong><span>Ofertas selecionadas</span></div>
      </a>
      <a class="back" href="/">Voltar ao ecossistema</a>
    </header>
    <section id="app" class="loading"><div><div class="spinner"></div><p>Carregando oferta...</p></div></section>
  </main>

  <script type="module">
    import { firebaseConfig, FIREBASE_ROOT } from "../admin/config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const root = [FIREBASE_ROOT.ecosystemCollection, FIREBASE_ROOT.ecosystemDocument, FIREBASE_ROOT.modulesCollection, "offers"];
    const $app = document.getElementById("app");
    const params = new URLSearchParams(location.search);
    const offerKey = params.get("id") || params.get("oferta") || params.get("p") || "";

    const moneyText = value => String(value || "").trim();
    const clean = value => String(value || "").trim();
    const esc = value => String(value ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
    const statusOk = item => !["draft","hidden","inactive","archived"].includes(String(item.status || "published").toLowerCase());
    const slugify = text => String(text || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,90);

    async function getSettings(){
      try{
        const snap = await getDoc(doc(db, ...root, "settings", "main"));
        return snap.exists() ? snap.data() : {};
      }catch(error){ return {}; }
    }

    async function getOffers(){
      const snap = await getDocs(collection(db, ...root, "items"));
      return snap.docs.map(d => ({id:d.id, ...d.data()})).filter(statusOk).sort((a,b) => Number(a.order || 99) - Number(b.order || 99));
    }

    async function getOffer(key){
      const safe = clean(key);
      if(!safe) return null;
      try{
        const byId = await getDoc(doc(db, ...root, "items", safe));
        if(byId.exists()) return {id:byId.id, ...byId.data()};
      }catch(error){}
      const all = await getOffers();
      return all.find(item => String(item.slug || "") === safe || slugify(item.title) === safe || item.id === safe) || null;
    }

    function publicUrlForOffer(offer){
      return new URL(`/oferta/?id=${encodeURIComponent(offer.slug || offer.id)}`, location.origin).href;
    }

    async function registerClick(offer, source="button"){
      try{
        await fetch("/.netlify/functions/offer-click", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({offerId:offer.id, offerSlug:offer.slug || offer.id, source})
        });
      }catch(error){ console.warn("Falha ao registrar clique", error); }
    }

    function renderOffer(offer, settings={}){
      if(!offer || !statusOk(offer)){
        renderList(settings);
        return;
      }
      document.title = `${offer.title || "Oferta"} | Pense Offgrid`;
      const target = clean(offer.affiliateUrl || offer.url || offer.linkUrl || "");
      const buttonText = clean(offer.buttonText || settings.defaultButtonText || "Abrir oferta");
      const image = clean(offer.imageUrl || "");
      $app.className = "";
      $app.innerHTML = `
        <section class="hero">
          <div class="media">${image ? `<img src="${esc(image)}" alt="${esc(offer.title || "Oferta")}" loading="eager">` : `<div class="placeholder">🛒</div>`}</div>
          <article class="panel">
            ${offer.badge ? `<span class="badge">${esc(offer.badge)}</span>` : `<span class="badge">Oferta selecionada</span>`}
            <h1>${esc(offer.title || "Oferta Pense Offgrid")}</h1>
            <p class="desc">${esc(offer.description || settings.subtitle || "Produto selecionado para apoiar seu projeto off-grid.")}</p>
            <div class="priceRow">
              ${offer.price ? `<div class="price">${esc(moneyText(offer.price))}</div>` : ""}
              ${offer.oldPrice ? `<div class="old">${esc(moneyText(offer.oldPrice))}</div>` : ""}
            </div>
            ${offer.coupon ? `<div class="coupon">🏷️ Cupom: <strong>${esc(offer.coupon)}</strong></div>` : ""}
            <div class="meta">
              <div><small>Loja</small><strong>${esc(offer.store || "Parceiro/marketplace")}</strong></div>
              <div><small>Categoria</small><strong>${esc(offer.category || "Offgrid")}</strong></div>
              <div><small>Marca</small><strong>${esc(offer.brand || "Não informada")}</strong></div>
              <div><small>Cliques</small><strong>${Number(offer.clicks || 0)}</strong></div>
            </div>
            <div class="actions">
              <a id="openOffer" class="btn primary ${target ? "" : "disabled"}" href="${esc(target || "#")}" target="_blank" rel="nofollow sponsored noopener noreferrer">${esc(buttonText)} →</a>
              <button id="copyLink" class="btn ghost" type="button">Copiar link interno</button>
            </div>
          </article>
        </section>
        <section class="details">
          <div class="box"><h2>Detalhes</h2><p>${esc(offer.details || offer.description || "Confira os detalhes da oferta antes de finalizar a compra no site da loja.")}</p></div>
          <div class="box"><h2>Transparência</h2><p>${esc(settings.disclaimer || "Alguns links podem gerar comissão para apoiar o ecossistema Pense Offgrid, sem custo extra para você.")}</p></div>
        </section>`;
      document.getElementById("openOffer")?.addEventListener("click", () => registerClick(offer, "open_offer"));
      document.getElementById("copyLink")?.addEventListener("click", async () => {
        await navigator.clipboard.writeText(publicUrlForOffer(offer));
        registerClick(offer, "copy_internal_link");
        alert("Link interno copiado.");
      });
    }

    async function renderList(settings={}){
      const offers = await getOffers();
      document.title = `${settings.title || "Ofertas Pense Offgrid"}`;
      $app.className = "";
      if(!offers.length){
        $app.innerHTML = `<section class="empty"><div><h1>Nenhuma oferta publicada</h1><p>Cadastre ofertas no painel para exibir aqui.</p></div></section>`;
        return;
      }
      $app.innerHTML = `<article class="panel"><span class="badge">Central de ofertas</span><h1>${esc(settings.title || "Ofertas Pense Offgrid")}</h1><p class="desc">${esc(settings.subtitle || "Produtos selecionados para seu sistema off-grid.")}</p></article><section class="grid">${offers.map(offer => `<a class="offerCard" href="/oferta/?id=${encodeURIComponent(offer.slug || offer.id)}">${offer.imageUrl ? `<img src="${esc(offer.imageUrl)}" alt="">` : ""}<div><strong>${esc(offer.title || "Oferta")}</strong><span>${esc(offer.price || offer.store || "Ver oferta")}</span></div></a>`).join("")}</section>`;
    }

    (async function init(){
      try{
        const settings = await getSettings();
        if(offerKey){
          const offer = await getOffer(offerKey);
          renderOffer(offer, settings);
        }else{
          await renderList(settings);
        }
      }catch(error){
        console.error(error);
        $app.className = "empty";
        $app.innerHTML = `<div><h1>Não foi possível carregar as ofertas</h1><p>${esc(error.message || "Tente novamente em instantes.")}</p></div>`;
      }
    })();
  </script>

<script type="module">
  import { bootGlobalLinks } from "/assets/js/firebase-public.js";
  bootGlobalLinks().catch((error) => console.warn("Links globais fallback:", error));
</script>
</body>
</html>
